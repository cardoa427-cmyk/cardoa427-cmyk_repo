<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotfinder - Campus Study & Relax Spots</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .pop-in {
            animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="h-full text-slate-800 flex flex-col font-sans antialiased bg-slate-50 selection:bg-brand-500 selection:text-white">

    <div id="app-root" class="min-h-screen flex flex-col">
        <!-- Application UI will be dynamically rendered here -->
    </div>

    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl border border-slate-200 pop-in max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <div class="flex items-center space-x-2.5">
                    <div class="w-10 h-10 rounded-2xl bg-brand-100 text-brand-700 flex items-center justify-center font-bold text-lg">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-slate-900">Post a Study or Relax Spot</h2>
                        <p class="text-xs text-slate-500">Share your favorite campus location with fellow students</p>
                    </div>
                </div>
                <button onclick="closeAddModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Validation Error Banner -->
            <div id="modal-error-msg" class="hidden p-3.5 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-2xl space-y-1"></div>

            <form id="post-spot-form" onsubmit="handlePostSubmit(event)" class="space-y-4">
                
                <!-- Username Field -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Username <span class="text-rose-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="form-username" 
                        maxlength="30"
                        placeholder="e.g. campus_crammer or Alex_P" 
                        class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"
                    />
                </div>

                <!-- Place Type Selection (pick_from_a_list) -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                        Space Category (place_type) <span class="text-rose-500">*</span>
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                        <label class="flex items-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition">
                            <input type="radio" name="place_type" value="Study" checked class="w-4 h-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-2 text-xs font-semibold text-slate-800 flex items-center gap-1">
                                📖 Study
                            </span>
                        </label>
                        <label class="flex items-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition">
                            <input type="radio" name="place_type" value="relax" class="w-4 h-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-2 text-xs font-semibold text-slate-800 flex items-center gap-1">
                                🛋️ Relax
                            </span>
                        </label>
                        <label class="flex items-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition">
                            <input type="radio" name="place_type" value="coffee" class="w-4 h-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-2 text-xs font-semibold text-slate-800 flex items-center gap-1">
                                ☕ Coffee
                            </span>
                        </label>
                        <label class="flex items-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition">
                            <input type="radio" name="place_type" value="eating" class="w-4 h-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-2 text-xs font-semibold text-slate-800 flex items-center gap-1">
                                🍕 Eating
                            </span>
                        </label>
                        <label class="flex items-center p-2.5 rounded-xl border border-slate-200 bg-slate-50 hover:bg-slate-100 cursor-pointer transition sm:col-span-2">
                            <input type="radio" name="place_type" value="meetings" class="w-4 h-4 text-brand-600 focus:ring-brand-500">
                            <span class="ml-2 text-xs font-semibold text-slate-800 flex items-center gap-1">
                                👥 Meetings
                            </span>
                        </label>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            Rating out of 10 Stars <span class="text-rose-500">*</span>
                        </label>
                        <span id="rating-number-display" class="text-xs font-extrabold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-md border border-amber-200">
                            8 / 10 Stars
                        </span>
                    </div>
                    <input type="hidden" id="form-rating-value" value="8" />
                    
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-200 flex flex-wrap items-center justify-between gap-1" id="star-picker-container">
                        <!-- Rendered by JavaScript -->
                    </div>
                </div>

                <!-- Location Link Field -->
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">
                        Location Link <span class="text-slate-400 font-normal">(Google Maps or URL)</span>
                    </label>
                    <div class="relative">
                        <i class="fa-solid fa-link absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                        <input 
                            type="url" 
                            id="form-location-link" 
                            placeholder="https://maps.google.com/..." 
                            class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"
                        />
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1">
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
                            Review / Commentary <span class="text-rose-500">*</span>
                        </label>
                        <span id="char-counter" class="text-xs font-medium text-slate-400">0 / 500</span>
                    </div>
                    <textarea 
                        id="form-review-text" 
                        rows="3" 
                        maxlength="500"
                        oninput="updateCharCounter(this.value.length)"
                        placeholder="Describe the noise level, outlets, comfortable seating, lighting, coffee quality..." 
                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition"
                    ></textarea>
                </div>

                <!-- Submit Action Buttons -->
                <div class="pt-3 border-t border-slate-100 flex items-center justify-end space-x-3">
                    <button 
                        type="button" 
                        onclick="closeAddModal()" 
                        class="px-4 py-2.5 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition"
                    >
                        Cancel
                    </button>
                    <button 
                        type="submit" 
                        class="px-6 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md shadow-brand-500/20 transition flex items-center gap-2"
                    >
                        <i class="fa-solid fa-paper-plane"></i>
                        <span>Publish Review</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <div id="toast-notification" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 pointer-events-none">
        <div class="bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 text-xs font-semibold">
            <i class="fa-solid fa-circle-check text-brand-400 text-base"></i>
            <span id="toast-msg">Post saved successfully!</span>
        </div>
    </div>

    <script>
        /* ==========================================================================
           DATA BLOCK (SWAPPABLE FOR REAL DATABASE LATER)
           Starts as an empty array (0 saved spots).
           ========================================================================== */
        const INITIAL_ROWS = [];
        /* ==========================================================================
           END DATA BLOCK
           ========================================================================== */

        // Application State
        let postsData = [...INITIAL_ROWS];
        let selectedPlaceType = 'ALL';
        let sortOrder = 'newest'; // 'newest' (newest to oldest) or 'oldest' (oldest to newest)
        let visibleItemsCount = 10; 
        const PLACE_TYPES = ['Study', 'relax', 'coffee', 'eating', 'meetings'];

        function setupStarPicker(initialRating = 8) {
            const container = document.getElementById('star-picker-container');
            const hiddenInput = document.getElementById('form-rating-value');
            const displaySpan = document.getElementById('rating-number-display');
            if (!container) return;

            hiddenInput.value = initialRating;
            displaySpan.innerText = `${initialRating} / 10 Stars`;

            let starsHtml = '';
            for (let i = 1; i <= 10; i++) {
                const isActive = i <= initialRating;
                starsHtml += `
                    <button 
                        type="button" 
                        onclick="setFormRating(${i})" 
                        onmouseenter="highlightFormStars(${i})" 
                        onmouseleave="resetFormStars()" 
                        class="p-1 focus:outline-none transition transform hover:scale-125"
                        title="${i} out of 10 stars"
                    >
                        <i id="picker-star-${i}" class="fa-solid fa-star text-base ${isActive ? 'text-amber-400' : 'text-slate-200'}"></i>
                    </button>
                `;
            }
            container.innerHTML = starsHtml;
        }

        window.setFormRating = function(val) {
            document.getElementById('form-rating-value').value = val;
            document.getElementById('rating-number-display').innerText = `${val} / 10 Stars`;
            highlightFormStars(val);
        };

        window.highlightFormStars = function(hoverVal) {
            for (let i = 1; i <= 10; i++) {
                const star = document.getElementById(`picker-star-${i}`);
                if (star) {
                    if (i <= hoverVal) {
                        star.className = 'fa-solid fa-star text-base text-amber-400';
                    } else {
                        star.className = 'fa-solid fa-star text-base text-slate-200';
                    }
                }
            }
        };

        window.resetFormStars = function() {
            const currentVal = parseInt(document.getElementById('form-rating-value').value, 10) || 8;
            highlightFormStars(currentVal);
        };

        window.openAddModal = function() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('modal-error-msg').classList.add('hidden');
            setupStarPicker(8);
        };

        window.closeAddModal = function() {
            document.getElementById('add-modal').classList.add('hidden');
        };

        window.updateCharCounter = function(len) {
            const counter = document.getElementById('char-counter');
            if (!counter) return;
            counter.innerText = `${len} / 500`;
            if (len >= 500) {
                counter.className = "text-xs font-bold text-rose-600";
            } else if (len > 450) {
                counter.className = "text-xs font-semibold text-amber-600";
            } else {
                counter.className = "text-xs font-medium text-slate-400";
            }
        };

        window.handlePostSubmit = function(e) {
            e.preventDefault();
            const username = document.getElementById('form-username').value.trim();
            const rating = parseInt(document.getElementById('form-rating-value').value, 10);
            const location_link = document.getElementById('form-location-link').value.trim();
            const review = document.getElementById('form-review-text').value.trim();
            
            // Get selected place_type radio choice
            const placeTypeRadios = document.getElementsByName('place_type');
            let place_type = 'Study';
            for (const r of placeTypeRadios) {
                if (r.checked) {
                    place_type = r.value;
                    break;
                }
            }

            const errorContainer = document.getElementById('modal-error-msg');
            errorContainer.classList.add('hidden');
            errorContainer.innerHTML = '';

            // Validation check
            const errors = [];
            if (!username) errors.push('Please enter your username.');
            if (!review) errors.push('Please write a review commentary before submitting.');
            if (review.length > 500) errors.push('Review exceeds the 500 character limit.');

            if (errors.length > 0) {
                errorContainer.innerHTML = `<ul class="list-disc pl-4 space-y-0.5">${errors.map(err => `<li>${err}</li>`).join('')}</ul>`;
                errorContainer.classList.remove('hidden');
                return;
            }

            // Create new post record
            const newPost = {
                id: 'spot-' + Date.now(),
                username: username,
                place_type: place_type,
                rating: rating,
                review: review,
                location_link: location_link,
                added_at: new Date().toISOString()
            };

            postsData.unshift(newPost);
            closeAddModal();
            document.getElementById('post-spot-form').reset();
            showToast("Review published successfully!");
            renderApp();
        };

        window.setPlaceTypeFilter = function(type) {
            selectedPlaceType = type;
            visibleItemsCount = 10;
            renderApp();
        };

        window.setSortOrder = function(order) {
            sortOrder = order;
            renderApp();
        };

        window.clearFilters = function() {
            selectedPlaceType = 'ALL';
            sortOrder = 'newest';
            visibleItemsCount = 10;
            renderApp();
        };

        window.loadMorePosts = function() {
            visibleItemsCount += 15;
            renderApp();
        };

        window.clearAllData = function() {
            postsData = [];
            showToast("All posts cleared.");
            renderApp();
        };

        function formatAge(isoStr) {
            if (!isoStr) return 'Just now';
            try {
                const diffMs = Date.now() - new Date(isoStr).getTime();
                const diffMins = Math.floor(diffMs / (1000 * 60));
                const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                const diffDays = Math.floor(diffMs / (1000 * 60 * 60 * 24));

                if (diffMins < 1) return 'Just now';
                if (diffMins < 60) return `${diffMins}m ago`;
                if (diffHours < 24) return `${diffHours}h ago`;
                return `${diffDays}d ago`;
            } catch (e) {
                return 'Recently';
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function getPlaceTypeBadge(type) {
            switch(type) {
                case 'Study':
                    return '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800 border border-emerald-200">📖 Study</span>';
                case 'relax':
                    return '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-blue-100 text-blue-800 border border-blue-200">🛋️ Relax</span>';
                case 'coffee':
                    return '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-amber-100 text-amber-800 border border-amber-200">☕ Coffee</span>';
                case 'eating':
                    return '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-rose-100 text-rose-800 border border-rose-200">🍕 Eating</span>';
                case 'meetings':
                    return '<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-purple-100 text-purple-800 border border-purple-200">👥 Meetings</span>';
                default:
                    return `<span class="px-2.5 py-1 text-xs font-bold rounded-full bg-slate-100 text-slate-800 border border-slate-200">${escapeHtml(type)}</span>`;
            }
        }

        function getStarRatingVisual(score) {
            let stars = '';
            for (let i = 1; i <= 10; i++) {
                if (i <= score) {
                    stars += '<i class="fa-solid fa-star text-amber-400 text-[10px]"></i>';
                } else {
                    stars += '<i class="fa-regular fa-star text-slate-200 text-[10px]"></i>';
                }
            }
            return `
                <div class="flex items-center space-x-1">
                    <div class="flex items-center space-x-0.5">${stars}</div>
                    <span class="text-xs font-black text-slate-800 ml-1">${score}/10</span>
                </div>
            `;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-msg');
            msgEl.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        function renderApp() {
            const root = document.getElementById('app-root');
            if (!root) return;

            // 1. Filter Posts by category choice
            let filtered = [...postsData];

            if (selectedPlaceType !== 'ALL') {
                filtered = filtered.filter(p => p.place_type === selectedPlaceType);
            }

            // 2. Sort Posts by Age (Newest First vs Oldest First)
            filtered.sort((a, b) => {
                const timeA = new Date(a.added_at).getTime();
                const timeB = new Date(b.added_at).getTime();
                return sortOrder === 'newest' ? timeB - timeA : timeA - timeB;
            });

            // 3. Paginated window for infinite list support
            const visibleSlice = filtered.slice(0, visibleItemsCount);
            const hasMore = visibleItemsCount < filtered.length;

            root.innerHTML = `
                <!-- Navigation Header -->
                <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
                    <div class="max-w-5xl mx-auto px-4 sm:px-6">
                        <div class="flex items-center justify-between h-16">
                            
                            <!-- Logo Branding -->
                            <div class="flex items-center space-x-3">
                                <div class="w-10 h-10 rounded-2xl bg-brand-600 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                                    <i class="fa-solid fa-map-location-dot text-lg"></i>
                                </div>
                                <div>
                                    <h1 class="text-xl font-extrabold text-slate-900 tracking-tight leading-none">Spotfinder</h1>
                                    <p class="text-[11px] font-semibold text-slate-500 mt-0.5">Campus Study & Chill Spots</p>
                                </div>
                            </div>

                            <!-- Pop-up Adding View Trigger -->
                            <button 
                                onclick="openAddModal()" 
                                class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md shadow-brand-500/20 transition flex items-center gap-2 hover:scale-105 active:scale-95"
                            >
                                <i class="fa-solid fa-plus text-xs"></i>
                                <span>Post a Spot</span>
                            </button>
                        </div>
                    </div>
                </header>

                <!-- Main Looking View Feed -->
                <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">
                    
                    <!-- Filter Controls Toolbar -->
                    <div class="bg-white p-4 sm:p-5 rounded-2xl border border-slate-200/80 shadow-sm space-y-4">
                        
                        <div class="flex flex-col sm:flex-row gap-3 items-center justify-between">
                            
                            <div class="text-xs font-extrabold text-slate-400 uppercase tracking-wider">
                                Browse Categories
                            </div>

                            <!-- Age Sort Selector (Requirement: Sort from newest/oldest) -->
                            <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5 w-full sm:w-auto justify-between sm:justify-start">
                                <label class="text-xs font-semibold text-slate-500 whitespace-nowrap">
                                    <i class="fa-solid fa-arrow-down-up-wide text-slate-400 mr-1"></i>Sort by Age:
                                </label>
                                <select onchange="setSortOrder(this.value)" class="bg-transparent text-xs font-bold text-slate-800 focus:outline-none cursor-pointer">
                                    <option value="newest" ${sortOrder === 'newest' ? 'selected' : ''}>Newest First</option>
                                    <option value="oldest" ${sortOrder === 'oldest' ? 'selected' : ''}>Oldest First</option>
                                </select>
                            </div>
                        </div>

                        <!-- Category Filter Pills (Requirement: Filter by space type) -->
                        <div class="pt-3 border-t border-slate-100 flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
                            <button 
                                onclick="setPlaceTypeFilter('ALL')" 
                                class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition border ${selectedPlaceType === 'ALL' ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}"
                            >
                                All Spots (${postsData.length})
                            </button>
                            ${PLACE_TYPES.map(type => {
                                const count = postsData.filter(p => p.place_type === type).length;
                                const isSelected = selectedPlaceType === type;
                                return `
                                    <button 
                                        onclick="setPlaceTypeFilter('${type}')" 
                                        class="px-3.5 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition border flex items-center gap-1.5 ${isSelected ? 'bg-brand-600 text-white border-brand-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}"
                                    >
                                        <span>${type}</span>
                                        <span class="px-1.5 py-0.2 text-[10px] rounded-md ${isSelected ? 'bg-brand-700 text-white' : 'bg-slate-200 text-slate-600'}">${count}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                    </div>

                    <!-- Active Status Bar -->
                    <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                        <div>
                            Showing <span class="font-bold text-slate-900">${visibleSlice.length}</span> of <span class="font-bold text-slate-900">${filtered.length}</span> reviews
                            ${selectedPlaceType !== 'ALL' ? ` in <span class="font-bold text-brand-600">${selectedPlaceType}</span>` : ''}
                        </div>
                        ${selectedPlaceType !== 'ALL' ? `
                            <button onclick="clearFilters()" class="text-brand-600 hover:underline font-bold flex items-center gap-1">
                                <i class="fa-solid fa-rotate-left text-[10px]"></i> Reset Category
                            </button>
                        ` : ''}
                    </div>

                    <!-- Awkward Case: Nothing saved yet -->
                    ${filtered.length === 0 ? `
                        <div class="bg-white rounded-3xl border border-slate-200 p-12 text-center max-w-md mx-auto space-y-4 shadow-sm my-8 fade-in">
                            <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-full flex items-center justify-center mx-auto text-2xl">
                                <i class="fa-solid fa-ghost"></i>
                            </div>
                            <div class="space-y-1">
                                <h3 class="text-lg font-bold text-slate-900">Be the first to post something</h3>
                                <p class="text-xs text-slate-500">
                                    ${postsData.length === 0 
                                        ? "No study or relax spots have been added yet. Share your favorite location!" 
                                        : "No reviews match your selected category filter."}
                                </p>
                            </div>
                            <div class="pt-2 flex flex-wrap justify-center gap-2">
                                ${postsData.length === 0 ? `
                                    <button onclick="openAddModal()" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs rounded-xl shadow-md transition">
                                        + Post A Spot
                                    </button>
                                ` : `
                                    <button onclick="clearFilters()" class="px-4 py-2 bg-slate-900 text-white font-bold text-xs rounded-xl hover:bg-slate-800 transition">
                                        Clear Category Filter
                                    </button>
                                `}
                            </div>
                        </div>
                    ` : `
                        <!-- Feed Cards Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${visibleSlice.map(post => renderPostCard(post)).join('')}
                        </div>
                    `}

                    <!-- Pagination and load more handler -->
                    ${filtered.length > 0 ? `
                        <div class="pt-6 pb-8 text-center space-y-3">
                            ${hasMore ? `
                                <button 
                                    onclick="loadMorePosts()" 
                                    class="px-6 py-3 bg-white border border-slate-200 hover:bg-slate-100 text-slate-800 font-bold text-xs rounded-2xl shadow-sm transition inline-flex items-center gap-2"
                                >
                                    <span>Load More Reviews</span>
                                    <i class="fa-solid fa-chevron-down text-[10px]"></i>
                                </button>
                                <p class="text-[11px] text-slate-400">Showing ${visibleSlice.length} out of ${filtered.length} posts</p>
                            ` : `
                                <div class="p-6 bg-slate-100 rounded-2xl border border-slate-200/80 inline-block max-w-md w-full">
                                    <p class="text-xs font-bold text-slate-700 mb-1">🎉 You've reached the end of all reviews!</p>
                                    <p class="text-[11px] text-slate-500">All ${filtered.length} saved rows have been displayed on screen.</p>
                                </div>
                            `}
                        </div>
                    ` : ''}

                </main>

                <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500 mt-auto">
                    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
                        <p>© Spotfinder — Memory App Front-End</p>
                        <div class="flex items-center space-x-4">
                            <button onclick="clearAllData()" class="text-rose-600 hover:text-rose-800 underline font-semibold">Clear All Posts</button>
                        </div>
                    </div>
                </footer>
            `;
        }

        function renderPostCard(post) {
            return `
                <div class="bg-white rounded-2xl border border-slate-200/90 p-5 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-3 fade-in group">
                    <div class="space-y-3">
                        <!-- Card Header: Username, Badge & Rating -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-2">
                                <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-800 font-extrabold text-xs flex items-center justify-center">
                                    ${escapeHtml(post.username.charAt(0).toUpperCase())}
                                </div>
                                <div>
                                    <div class="text-xs font-bold text-slate-900">@${escapeHtml(post.username)}</div>
                                    <div class="text-[10px] font-medium text-slate-400">${formatAge(post.added_at)}</div>
                                </div>
                            </div>
                            ${getPlaceTypeBadge(post.place_type)}
                        </div>

                        <!-- Review Text -->
                        <p class="text-xs text-slate-700 leading-relaxed font-normal bg-slate-50 p-3 rounded-xl border border-slate-100">
                            "${escapeHtml(post.review)}"
                        </p>
                    </div>

                    <!-- Card Footer: Rating & Location Link -->
                    <div class="pt-2 border-t border-slate-100 flex items-center justify-between">
                        ${getStarRatingVisual(post.rating)}

                        ${post.location_link ? `
                            <a 
                                href="${escapeHtml(post.location_link)}" 
                                target="_blank" 
                                rel="noopener noreferrer" 
                                class="px-2.5 py-1 bg-slate-100 hover:bg-brand-50 hover:text-brand-700 text-slate-600 text-[11px] font-bold rounded-lg border border-slate-200 transition inline-flex items-center gap-1"
                            >
                                <i class="fa-solid fa-location-dot text-brand-600 text-[10px]"></i>
                                <span>Map Link</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i>
                            </a>
                        ` : `
                            <span class="text-[10px] text-slate-400 italic">No link provided</span>
                        `}
                    </div>
                </div>
            `;
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderApp();
        });
    </script>
</body>
</html>
